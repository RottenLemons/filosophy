name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-and-test:
    runs-on: windows-latest

    steps:
      - name: Disable git autocrlf
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true

      - name: Verify gofmt
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Error "The following files fail gofmt:`n$unformatted"
            exit 1
          }

      - name: Build Tokenizers Library
        shell: pwsh
        run: |
          if (Test-Path "C:\mingw64\bin") {
            $env:PATH = "C:\mingw64\bin;$env:PATH"
          }
          rustup target add x86_64-pc-windows-gnu
          go mod download
          ./scripts/build-tokenizers.ps1

      - name: Go Test
        shell: pwsh
        run: |
          if (Test-Path "C:\mingw64\bin") {
            $env:PATH = "C:\mingw64\bin;$env:PATH"
          }
          go test -v -tags no_kreuzberg ./shared/...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        shell: pwsh
        run: |
          Push-Location frontend
          npm ci
          npm run build
          Pop-Location
