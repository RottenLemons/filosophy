name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-and-test:
    runs-on: windows-latest

    steps:
      - name: Disable git autocrlf
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true

      - name: Verify gofmt
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Error "The following files fail gofmt:`n$unformatted"
            exit 1
          }

      - name: Cache Kreuzberg FFI
        id: cache-kreuzberg
        uses: actions/cache@v4
        with:
          path: kreuzberg-ffi
          key: kreuzberg-ffi-v4.10.4-windows-x86_64

      - name: Download Kreuzberg FFI
        if: steps.cache-kreuzberg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -L -o "$env:TEMP/go-ffi-windows.tar.gz" "https://github.com/kreuzberg-dev/kreuzberg-lts/releases/download/v4.10.4/go-ffi-windows-x86_64.tar.gz"
          tar -xzf "$env:TEMP/go-ffi-windows.tar.gz" -C .

      - name: Set up Kreuzberg runtime
        shell: pwsh
        run: |
          Copy-Item "kreuzberg-ffi/lib/kreuzberg_ffi.dll" -Destination "." -Force
          Copy-Item "kreuzberg-ffi/lib/kreuzberg_ffi.dll" -Destination "shared" -Force
          $absLib = (Resolve-Path "kreuzberg-ffi/lib").Path
          "$absLib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Tokenizers Library
        shell: pwsh
        run: |
          if (Test-Path "C:\mingw64\bin") {
            $env:PATH = "C:\mingw64\bin;$env:PATH"
          }
          rustup target add x86_64-pc-windows-gnu
          go mod download
          ./scripts/build-tokenizers.ps1

      - name: Go Test
        shell: pwsh
        run: |
          if (Test-Path "C:\mingw64\bin") {
            $env:PATH = "C:\mingw64\bin;$env:PATH"
          }
          go test -v ./shared/...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        shell: pwsh
        run: |
          Push-Location frontend
          npm ci
          npm run build
          Pop-Location
